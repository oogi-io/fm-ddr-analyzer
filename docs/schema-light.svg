<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="entities and refs: refs joins entities to entities, one row per use"><rect x="40" y="40" width="300" height="138" rx="6" fill="#FFFFFF" stroke="#C9D4DA"/><rect x="40" y="40" width="300" height="30" rx="6" fill="#1E6E8C"/><rect x="40" y="58" width="300" height="12" fill="#1E6E8C"/><text x="52" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">entities</text><text x="52" y="84" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">one row per thing in the solution</text><text x="52" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">entity_id</text><text x="328" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75" text-anchor="end">PK</text><text x="52" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">kind</text><text x="328" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75" text-anchor="end">field, script, layout...</text><text x="52" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">name</text><text x="52" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">parent_entity_id</text><text x="328" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75" text-anchor="end">FK → entities</text><rect x="580" y="40" width="300" height="138" rx="6" fill="#FFFFFF" stroke="#C9D4DA"/><rect x="580" y="40" width="300" height="30" rx="6" fill="#1E6E8C"/><rect x="580" y="58" width="300" height="12" fill="#1E6E8C"/><text x="592" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">refs</text><text x="592" y="84" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">one row per use: this uses that</text><text x="592" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">ref_id</text><text x="868" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75" text-anchor="end">PK</text><text x="592" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">source_entity_id</text><text x="868" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75" text-anchor="end">FK → entities</text><text x="592" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">target_entity_id</text><text x="868" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75" text-anchor="end">FK → entities</text><text x="592" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#13222B">context</text><text x="868" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5B6B75" text-anchor="end">how it is used</text><path d="M340 96 H 470 V 120 H 580" stroke="#1E6E8C" stroke-width="1.8" fill="none"/><path d="M350 89 V 103" stroke="#1E6E8C" stroke-width="1.8" fill="none"/><path d="M565 120 L 580 112 M565 120 L 580 128 M565 120 L 580 120" stroke="#1E6E8C" stroke-width="1.8" fill="none"/><text x="480" y="114" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">source (the user)</text><path d="M340 104 H 430 V 140 H 580" stroke="#1E6E8C" stroke-width="1.8" fill="none"/><path d="M350 97 V 111" stroke="#1E6E8C" stroke-width="1.8" fill="none"/><path d="M565 140 L 580 132 M565 140 L 580 148 M565 140 L 580 140" stroke="#1E6E8C" stroke-width="1.8" fill="none"/><text x="440" y="157" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B75">target (the used)</text><text x="40" y="215" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#13222B">refs joins entities to entities. Example: the step <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Set Field</tspan> → the field <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Name_First</tspan>, context <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">step_target</tspan>.</text><text x="40" y="238" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B75">where = the refs rows whose target is the thing you asked about.</text></svg>